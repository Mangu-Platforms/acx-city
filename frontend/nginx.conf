server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA; fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy so the frontend never needs a hardcoded backend host.
    # BACKEND_URL is substituted at deploy time (or defaults to the compose service).
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
