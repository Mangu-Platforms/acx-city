# Railway configuration for the BACKEND (API) service.
# In Railway dashboard: set this service's Root Directory to "backend".
#
# Required env vars to set in Railway dashboard:
#   JWT_SECRET          — openssl rand -hex 32
#   CORS_ALLOW_ORIGINS  — https://your-dashboard.vercel.app,https://your-frontend.up.railway.app
#   POSTGRES_PASSWORD   — set when you create the Postgres service
#   DATABASE_URL        — auto-injected by Railway from the Postgres service
#
# Optional:
#   AUTH_MODE           — legacy (default) or supabase
#   SENTRY_DSN          — error monitoring
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — enable Polly TTS

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "./entrypoint.sh gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 3600 wsgi:app"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 5

[variables]
  ROLE                = "api"
  HOST                = "0.0.0.0"
  PORT                = "5000"
  UPLOAD_FOLDER       = "/data/uploads"
  OUTPUT_FOLDER       = "/data/outputs"
  CACHE_FOLDER        = "/data/cache"
  STORAGE_BACKEND     = "local"
  STORAGE_LOCAL_ROOT  = "/data/storage"
  LOG_FORMAT          = "json"
  LOG_LEVEL           = "INFO"
