# Railway configuration for the COMBINED (API + worker) service.
#
# Railway volumes can be mounted by exactly one service, but the API and the
# worker must share /data. Until object storage (STORAGE_BACKEND=s3) is
# configured, the supported Railway topology is this single combined service
# running both processes via start_combined.sh.
#
# In Railway dashboard: Root Directory "backend", Config File
# "backend/railway.combined.toml", volume mounted at /data.

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "./entrypoint.sh bash start_combined.sh"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 120
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 5

[variables]
  ROLE                = "api"
  HOST                = "0.0.0.0"
  PORT                = "5000"
  UPLOAD_FOLDER       = "/data/uploads"
  OUTPUT_FOLDER       = "/data/outputs"
  CACHE_FOLDER        = "/data/cache"
  STORAGE_BACKEND     = "local"
  STORAGE_LOCAL_ROOT  = "/data/storage"
  LOG_FORMAT          = "json"
  LOG_LEVEL           = "INFO"
