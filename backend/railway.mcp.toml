# Railway configuration for the OPTIONAL MCP service (AI-agent interface).
# In Railway dashboard: set this service's Root Directory to "backend" and its
# Config File to "railway.mcp.toml". Same Dockerfile as the API — only the
# start command differs.
#
# Required env vars (set in Railway dashboard):
#   MCP_ENABLED  — "true" (refuses to start otherwise)
#   MCP_API_KEY  — openssl rand -hex 32; MCP clients send it as a Bearer token
#   DATABASE_URL — auto-injected by Railway from the Postgres service
#
# MCP clients connect to:  https://<this-service-domain>/mcp
#   headers: { "Authorization": "Bearer <MCP_API_KEY>" }

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "./entrypoint.sh python mcp_server.py"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 5

[variables]
  ROLE       = "mcp"
  LOG_FORMAT = "json"
  LOG_LEVEL  = "INFO"
