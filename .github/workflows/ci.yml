name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audiobook
          POSTGRES_PASSWORD: audiobook
          POSTGRES_DB: audiobook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audiobook"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Tests run against real Postgres so the FOR UPDATE SKIP LOCKED concurrency
      # test executes (it auto-skips on SQLite).
      DATABASE_URL: postgresql+psycopg://audiobook:audiobook@localhost:5432/audiobook_test
      # 32+ bytes: PyJWT >= 2.13 warns on HS256 keys under the RFC 7518 minimum.
      JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Verify migrations apply
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
      - name: Run pipeline tests
        working-directory: ${{ github.workspace }}
        run: python -m pytest pipeline/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # Deterministic install — no "npm ci || npm i" fallback (blueprint rescue item).
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install deps
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
