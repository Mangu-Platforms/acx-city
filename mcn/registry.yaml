# MCN registry — single source of truth for every service's environment.
# Add a repo/service here, run `python provision.py`, done. No dashboards.
#
# Value syntax:
#   literal string          used as-is
#   ${secret:NAME}          generated once (see `secrets:`), reused forever
#   ${url:railway:SVC}      resolved to the service's public Railway URL
#   ${url:vercel:PROJ}      resolved to the Vercel project's production URL
#   ${local:NAME}           taken from mcn/.env.local (manual override)
#   ${{Service.VAR}}        Railway reference variable, resolved by Railway
#                           itself at deploy time (passed through verbatim)

network:
  name: acx-mcn

# Generated on first run, persisted to mcn/.secrets.json (gitignored).
secrets:
  JWT_SECRET: {bytes: 32}
  STORAGE_SIGNING_SECRET: {bytes: 32}
  MCP_API_KEY: {bytes: 32}

repos:
  acx-city:
    railway:
      # Railway kept its auto-generated project name; the app service inside
      # it is `acx-city` (plus the managed Postgres service).
      project: tranquil-fascination
      services:
        # Combined API + worker service (Railway volumes mount to exactly one
        # service, so both processes share this service and its /data volume;
        # see backend/railway.combined.toml).
        backend:
          env:
            # Modern Railway does not auto-inject DATABASE_URL into app
            # services — it must be a reference variable to the Postgres
            # service, resolved by Railway at deploy time.
            DATABASE_URL: "${{Postgres.DATABASE_URL}}"
            AUTH_MODE: legacy
            JWT_SECRET: ${secret:JWT_SECRET}
            STORAGE_SIGNING_SECRET: ${secret:STORAGE_SIGNING_SECRET}
            LOG_FORMAT: json
            LOG_LEVEL: INFO
            QC_POLICY: warn
            # Railway mounts volumes owned by root; the image runs as a
            # non-root user, so tell Railway to run the container as uid 0
            # (https://docs.railway.com/volumes — Permissions).
            RAILWAY_RUN_UID: "0"
            PORT: "5000"
            UPLOAD_FOLDER: /data/uploads
            OUTPUT_FOLDER: /data/outputs
            CACHE_FOLDER: /data/cache
            STORAGE_BACKEND: local
            STORAGE_LOCAL_ROOT: /data/storage
            CORS_ALLOW_ORIGINS: ${url:vercel:dashboard}
            MCP_ENABLED: "true"
            MCP_API_KEY: ${secret:MCP_API_KEY}
        # React SPA behind nginx; proxies /api to the backend over Railway's
        # private network (frontend/nginx.conf.template).
        frontend:
          env:
            BACKEND_PRIVATE_URL: http://backend.railway.internal:5000
    vercel:
      projects:
        dashboard:
          # Next.js ops dashboard (rootDirectory: dashboard/). The canonical
          # project is `acx-city`; `acx-city-gmlo` is a duplicate import.
          project: acx-city
          env:
            NEXT_PUBLIC_API_URL: ${url:railway:backend}
