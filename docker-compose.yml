services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: audiobook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiobook}
      POSTGRES_DB: audiobook
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiobook"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      ROLE: api
      DATABASE_URL: postgresql+psycopg://audiobook:${POSTGRES_PASSWORD:-audiobook}@db:5432/audiobook
      REDIS_URL: redis://redis:6379/0
      UPLOAD_FOLDER: /data/uploads
      OUTPUT_FOLDER: /data/outputs
      CACHE_FOLDER: /data/cache
      # Storage defaults to the local backend on the shared volume. To use
      # Supabase Storage / S3, set STORAGE_BACKEND=s3 and the STORAGE_S3_* vars in .env.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: /data/storage
    ports:
      - "5000:5000"
    volumes:
      - audiobook-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    env_file:
      - .env
    environment:
      ROLE: worker
      DATABASE_URL: postgresql+psycopg://audiobook:${POSTGRES_PASSWORD:-audiobook}@db:5432/audiobook
      REDIS_URL: redis://redis:6379/0
      UPLOAD_FOLDER: /data/uploads
      OUTPUT_FOLDER: /data/outputs
      CACHE_FOLDER: /data/cache
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: /data/storage
    command: ["python", "worker.py"]
    volumes:
      # Shares the same data volume as the API so outputs/cache are visible to both.
      - audiobook-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started  # ensures migrations have started

  pipeline-worker:
    build: ./backend
    env_file:
      - .env
    environment:
      ROLE: pipeline
      DATABASE_URL: postgresql+psycopg://audiobook:${POSTGRES_PASSWORD:-audiobook}@db:5432/audiobook
      REDIS_URL: redis://redis:6379/0
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: /data/storage
    command: ["celery", "-A", "pipeline.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    volumes:
      - audiobook-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  audiobook-data:
