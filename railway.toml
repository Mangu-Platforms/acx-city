# ACX City — Railway Deployment
#
# This repo has three deployable services. Each has its own railway.toml:
#
#   backend/railway.toml        — Flask API (Root Directory: backend)
#   backend/railway.worker.toml — Job worker (Root Directory: backend, custom config file)
#   frontend/railway.toml       — React SPA via nginx (Root Directory: frontend)
#
# See RAILWAY_SETUP.md for the full step-by-step guide.
